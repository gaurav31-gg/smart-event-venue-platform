spring.application.name=config-server

server.port=8888

# Where Config Server reads the actual config files from
spring.cloud.config.server.git.uri=https://github.com/gaurav31-gg/venuelink-config-repo.git
spring.cloud.config.server.git.default-label=main

# If you registered Eureka Discovery Client too
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/